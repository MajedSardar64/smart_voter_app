name: smart_voter_app
description: "Smart Voter Info System."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.4+5

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  encrypt: ^5.0.3
  image: ^4.2.0
  path_provider: ^2.1.2 
  camera: ^0.11.0+2
  google_fonts: ^6.2.1
  connectivity_plus: ^6.1.0
  google_mlkit_text_recognition: ^0.14.0
  sqflite_sqlcipher: ^3.1.0+1
  path: ^1.9.0
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  printing: ^5.13.2
  pdf: ^3.11.1
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  http: ^1.2.1
  
  cupertino_icons: ^1.0.8
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  rename: ^3.1.0

flutter:
  uses-material-design: true

  fonts:
    - family: Bangla
      fonts:
        - asset: assets/fonts/Bangla.ttf